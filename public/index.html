<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Competitive Analysis</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #ffffff;
      color: #111;
    }

    h1 {
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    input {
      padding: 8px;
      width: 220px;
      font-size: 14px;
    }

    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      vertical-align: top;
      text-align: left;
    }

    th {
      background-color: #f4f4f4;
      font-weight: bold;
      width: 20%;
    }

    .status {
      margin-top: 14px;
      color: #333;
    }

    .error {
      margin-top: 14px;
      color: #b00020;
      white-space: pre-wrap;
    }

    pre {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #ddd;
      background: #fafafa;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>Competitive Analysis</h1>

  <div class="controls">
    <input id="companyA" placeholder="Company A" value="Abbott" />
    <input id="companyB" placeholder="Company B" value="Pfizer" />
    <button id="compareBtn">Compare</button>
  </div>

  <div id="status" class="status"></div>
  <div id="error" class="error"></div>

  <table id="resultTable" style="display:none;">
    <thead>
      <tr>
        <th>Field</th>
        <th id="companyAHeader"></th>
        <th id="companyBHeader"></th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>

  <pre id="rawOutput" style="display:none;"></pre>

  <script>
    /**
     * NOTE ON AUTHORSHIP
     * ------------------
     * This client-side logic was generated with the assistance of ChatGPT.
     * The intent of this project is to demonstrate how AI assisted development
     * can be used by product leaders to design, ship, and operate production
     * AI systems, and not to showcase UI coding experience.
     */

    function apiUrl() {
      // Always same-origin on Vercel
      return "/api/compare";
    }

    const btn = document.getElementById("compareBtn");
    const inputA = document.getElementById("companyA");
    const inputB = document.getElementById("companyB");

    btn.addEventListener("click", compare);

    [inputA, inputB].forEach(el => {
      el.addEventListener("keydown", e => {
        if (e.key === "Enter") compare();
      });
    });

    function setStatus(msg) {
      document.getElementById("status").textContent = msg || "";
    }

    function showError(msg) {
      document.getElementById("error").textContent = msg || "";
    }

    function resetUI() {
      showError("");
      setStatus("");
      document.getElementById("resultTable").style.display = "none";
      document.getElementById("rawOutput").style.display = "none";
      document.getElementById("resultBody").innerHTML = "";
      document.getElementById("rawOutput").textContent = "";
    }

    function sanitizeJsonText(text) {
      let t = (text || "").trim();
      if (t.startsWith("=")) t = t.slice(1).trim();
      t = t.replace(/^\uFEFF/, "");
      return t;
    }

    async function postJson(url, payload) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const text = sanitizeJsonText(await response.text());

      if (!response.ok) {
        throw new Error(`API error ${response.status}\n\n${text}`);
      }

      if (!text) throw new Error("Empty response body");

      let data;
      try {
        data = JSON.parse(text);
      } catch {
        throw new Error("Invalid JSON returned by API");
      }

      // Handle Hard Gate wrapper
      if (typeof data.ok === "boolean") {
        if (!data.ok) {
          throw new Error(data.reason || "Model output failed validation");
        }
        return data.result;
      }

      // Handle stringified JSON output
      if (typeof data.output === "string") {
        let cleaned = data.output
          .replace(/^```(?:json)?/i, "")
          .replace(/```$/i, "")
          .trim();

        if (cleaned.startsWith("{")) {
          try {
            data = JSON.parse(cleaned);
          } catch {}
        }
      }

      return data;
    }

    function renderResult(companyA, companyB, data) {
      if (Array.isArray(data?.table)) {
        document.getElementById("companyAHeader").textContent = companyA;
        document.getElementById("companyBHeader").textContent = companyB;

        const tbody = document.getElementById("resultBody");

        data.table.forEach(row => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><strong>${escapeHtml(row.field)}</strong></td>
            <td>${escapeHtml(row.companyA ?? "Data Not Available")}</td>
            <td>${escapeHtml(row.companyB ?? "Data Not Available")}</td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById("resultTable").style.display = "table";
        setStatus(data.summary || "Done.");
        return;
      }

      document.getElementById("rawOutput").textContent =
        JSON.stringify(data, null, 2);
      document.getElementById("rawOutput").style.display = "block";
      setStatus("Done (raw output).");
    }

    async function compare() {
      const companyA = inputA.value.trim();
      const companyB = inputB.value.trim();

      resetUI();

      if (!companyA || !companyB) {
        showError("Please enter both company names.");
        return;
      }

      btn.disabled = true;
      setStatus("Running analysis...");

      try {
        const data = await postJson(apiUrl(), { companyA, companyB });
        renderResult(companyA, companyB, data);
      } catch (err) {
        setStatus("");
        showError(err.message || "Request failed");
      } finally {
        btn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>

</body>
</html>
